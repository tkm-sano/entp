name: Update Models

on:
  workflow_dispatch:  # 手動実行
  repository_dispatch:
    types: [update-models-from-sheet]  # スプレッドシートからの実行
  push:
    branches:
      - main
    paths:
      - "assets/images/models/**"
      - "assets/videos/models/**"

concurrency:
  group: update-models
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger source
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "event_action=${{ github.event.action || '' }}"
      - name: Show dispatch payload
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          echo "client_payload.triggered_by=${{ github.event.client_payload.triggered_by || '' }}"
          echo "client_payload.spreadsheet_id=${{ github.event.client_payload.spreadsheet_id || '' }}"
          echo "client_payload.triggered_at=${{ github.event.client_payload.triggered_at || '' }}"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread oauth2client

      - name: Create credentials file
        run: |
          printf '%s' '${{ secrets.GOOGLE_SHEETS_KEY }}' | tr -d '\r' > creds.json

      - name: Validate credentials JSON
        run: python -m json.tool creds.json > /dev/null

      - name: Fetch spreadsheet, generate JSON and Markdown
        run: python scripts/fetch_and_generate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _models _data assets/images/models
          # Safety guard: never include README.md in this auto commit.
          git restore --staged README.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: sync models from spreadsheet and media"
          git push
