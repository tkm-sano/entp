name: Update Models

on:
  workflow_dispatch:  # 手動実行
  repository_dispatch:
    types: [update-models-from-sheet]  # スプレッドシートからの実行

concurrency:
  group: update-models
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger source
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "event_action=${{ github.event.action || '' }}"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread oauth2client

      - name: Create credentials file
        run: |
          printf '%s' '${{ secrets.GOOGLE_SHEETS_KEY }}' | tr -d '\r' > creds.json

      - name: Validate credentials JSON
        run: python -m json.tool creds.json > /dev/null

      - name: Fetch spreadsheet, generate JSON and Markdown
        run: python scripts/fetch_and_generate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _models _data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update models from spreadsheet"
          git push
