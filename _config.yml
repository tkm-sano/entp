# ---------------------------------
# サイト基本情報
# ---------------------------------
title: MissConnect
baseurl: "/entp"
url: "https://tkm-sano.github.io"
layouts_dir: "_layouts"
# Desktop/iCloud同期配下での書き込みタイムアウト回避
destination: "/tmp/talent-site/_site"

# ---------------------------------
# コレクション設定
# ---------------------------------
collections:
  models:
    output: true               # 個別ページを生成
    permalink: /models/:name/  # URL にモデルIDを使用

# ---------------------------------
# デフォルトレイアウト設定
# ---------------------------------
defaults:
  - scope:
      path: ""               # リポジトリ全体
      type: "models"
    values:
      layout: model          # _layouts/model.html を使用
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default        # デフォルトレイアウト

exclude:
  - scripts/
  - .github/
  - vendor/
  - .jekyll-cache/
  - _site/
  - _models/.jekyll-cache/
  - _models/_site/
  - scripts/__pycache__/
  - assets/icons/instagram.svg
  - _data/models.json
