# ---------------------------------
# サイト基本情報
# ---------------------------------
title: MissConnect
# Local previewではサブパスを付けない（/entp/ 404回避）
# GitHub Pages配備時に必要なら "/entp" を設定
baseurl: ""
url: "https://username.github.io"
layouts_dir: "_layouts"
# Desktop/iCloud同期配下での書き込みタイムアウト回避
destination: "/tmp/talent-site/_site"

# ---------------------------------
# コレクション設定
# ---------------------------------
collections:
  models:
    output: true               # 個別ページを生成
    permalink: /models/:name/  # URL にモデルIDを使用

# ---------------------------------
# デフォルトレイアウト設定
# ---------------------------------
defaults:
  - scope:
      path: ""               # リポジトリ全体
      type: "models"
    values:
      layout: model          # _layouts/model.html を使用
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default        # デフォルトレイアウト

exclude:
  - scripts/
  - .github/
