# Site settings
title: MissConnect
description: Talent Agency Website
baseurl: "/entp"  # リポジトリ名
url: "https://tkm-sano.github.io"  # あなたのGitHub Pages URL

# Collections
collections:
  talents:
    output: true
    permalink: /talents/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "talents"
    values:
      layout: "talent-single"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - talent-main-page.rb
  - README.md
  - _data/talents.yml  # 実データは除外