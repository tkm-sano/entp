<!-- ================================
   FILTER COMPONENT
================================ -->

<div class="filters">
  <div class="filter-row">
    <div class="filter-group">
      <strong>性別：</strong>
      <button class="filter-btn active" data-filter="gender" data-value="all">All</button>
      <button class="filter-btn" data-filter="gender" data-value="male">男性</button>
      <button class="filter-btn" data-filter="gender" data-value="female">女性</button>
    </div>

    <div class="filter-group" data-filter-group="tag">
      <strong>タグ：</strong>
      <button class="filter-btn" data-filter="tag" data-value="インフルエンサー">インフルエンサー</button>
      <button class="filter-btn" data-filter="tag" data-value="ミス">ミス</button>
      <button class="filter-btn" data-filter="tag" data-value="ミスター">ミスター</button>
      <button class="filter-btn" data-filter="tag" data-value="可愛い系">可愛い系</button>
      <button class="filter-btn" data-filter="tag" data-value="綺麗系">綺麗系</button>
      <button class="filter-btn" data-filter="tag" data-value="清楚系">清楚系</button>
      <button class="filter-btn" data-filter="tag" data-value="草食系">草食系</button>
      <button class="filter-btn" data-filter="tag" data-value="犬系">犬系</button>
    </div>
  </div>

  <div class="filter-row">
    <div class="filter-group filter-range-group">
      <strong>身長：</strong>
      <div class="range-filter" data-range-filter="height">
        <div class="range-values">
          <span data-range-label="height-min">150</span>cm - <span data-range-label="height-max">200</span>cm
        </div>
        <div class="range-inputs">
          <input type="range" min="150" max="200" value="150" step="1" data-filter="height-min">
          <input type="range" min="150" max="200" value="200" step="1" data-filter="height-max">
        </div>
      </div>
    </div>

    <div class="filter-group filter-range-group">
      <strong>年齢：</strong>
      <div class="range-filter" data-range-filter="age">
        <div class="range-values">
          <span data-range-label="age-min">18</span>歳 - <span data-range-label="age-max">24</span>歳
        </div>
        <div class="range-inputs">
          <input type="range" min="18" max="24" value="18" step="1" data-filter="age-min">
          <input type="range" min="18" max="24" value="24" step="1" data-filter="age-max">
        </div>
      </div>
    </div>
  </div>

</div>
