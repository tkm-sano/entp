<!-- ================================
   FILTER COMPONENT
================================ -->

<div class="filters-mobile-bar">
  <button type="button" class="filters-mobile-open" data-filter-action="open-sheet">
    SELECT
    <span class="filters-mobile-count" id="mobileFilterCount">0</span>
  </button>
</div>

<div class="filters-sheet-backdrop" data-filter-action="close-sheet"></div>

<section class="filters-sheet" id="filtersSheet" aria-label="SELECT条件" aria-hidden="false">
  <div class="filters-sheet-grip" aria-hidden="true"></div>
  <header class="filters-sheet-header">
    <h2>SELECT</h2>
    <button type="button" class="filters-sheet-close" data-filter-action="close-sheet" aria-label="SELECTを閉じる">×</button>
  </header>

  <div class="filters">
    <div class="filter-row">
      <div class="filter-group filter-select-group">
        <label for="filterGender">性別</label>
        <div class="select-wrap">
          <select id="filterGender" data-filter-select="gender">
            <option value="all">すべて</option>
            <option value="male">男性</option>
            <option value="female">女性</option>
          </select>
        </div>
      </div>

      <div class="filter-group filter-select-group filter-tag-group">
        <label for="filterTag">タグ</label>
        <div class="tag-options" id="filterTag">
          <label class="tag-option"><input type="checkbox" data-filter-tag="インフルエンサー"><span>インフルエンサー</span></label>
          <label class="tag-option"><input type="checkbox" data-filter-tag="ミス"><span>ミス</span></label>
          <label class="tag-option"><input type="checkbox" data-filter-tag="ミスター"><span>ミスター</span></label>
          <label class="tag-option"><input type="checkbox" data-filter-tag="可愛い系"><span>可愛い系</span></label>
          <label class="tag-option"><input type="checkbox" data-filter-tag="綺麗系"><span>綺麗系</span></label>
          <label class="tag-option"><input type="checkbox" data-filter-tag="清楚系"><span>清楚系</span></label>
          <label class="tag-option"><input type="checkbox" data-filter-tag="草食系"><span>草食系</span></label>
          <label class="tag-option"><input type="checkbox" data-filter-tag="犬系"><span>犬系</span></label>
        </div>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group filter-select-group filter-range-group">
        <label>身長</label>
        <div class="filter-range-selects">
          <div class="select-wrap">
            <select data-filter-select="height-min"></select>
          </div>
          <span>〜</span>
          <div class="select-wrap">
            <select data-filter-select="height-max"></select>
          </div>
        </div>
      </div>

      <div class="filter-group filter-select-group filter-range-group">
        <label>年齢</label>
        <div class="filter-range-selects">
          <div class="select-wrap">
            <select data-filter-select="age-min"></select>
          </div>
          <span>〜</span>
          <div class="select-wrap">
            <select data-filter-select="age-max"></select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="filters-sheet-actions">
    <button type="button" class="filter-btn" data-filter-action="reset">リセット</button>
    <button type="button" class="filter-btn active" data-filter-action="apply">適用</button>
  </div>
</section>
